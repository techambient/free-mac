name: Open Free Mac Terminal

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: macos-14

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Install Cloudflared & Setup Web Terminal
      run: |
        # Download and install Cloudflare's tunneling client
        brew install cloudflare/cloudflare/cloudflared
        
        # Install ttyd to turn the Mac console into a secure web panel
        brew install ttyd
        
        # Start a secure local web terminal instance in the background on port 8080
        # Username: admin | Password: password123
        ttyd -p 8080 -c admin:password123 login &
        sleep 3
        
        # Expose the local terminal port to a public temporary Cloudflare URL
        echo "=========================================================="
        echo "WAITING FOR YOUR FREE WEB TERMINAL LINK..."
        echo "=========================================================="
        cloudflared tunnel --url http://localhost:8080
