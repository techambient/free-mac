name: Open Free Mac Terminal

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: macos-14

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Mac Terminal Tunnel
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      run: |
        # Download and install ngrok via homebrew
        brew install ngrok/ngrok/ngrok
        
        # Configure the token
        ngrok config add-authtoken $NGROK_TOKEN
        
        # Enable the native macOS SSH service
        sudo systemsetup -setremotelogin on
        
        # Start the tunnel in the background
        ngrok tcp 22 --log=stdout > /dev/null &
        sleep 5
        
        # Query the ngrok API to pull the public endpoint out cleanly
        echo "=========================================================="
        echo "YOUR MAC TERMINAL SSH COMMAND IS BELOW:"
        curl -s http://127.0.0 | grep -o 'tcp://[^"]*'
        echo "=========================================================="
        echo "Password for username 'runner' is: runner"
        echo "=========================================================="

    - name: Keep Runner Session Alive
      run: |
        # Keeps your server open for up to 6 hours
        sleep 21600
